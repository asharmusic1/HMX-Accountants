# example netlify.toml
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = ".next"

[[redirects]]
  from = "https://hmx-accountants.netlify.app/*"
  to = "https://hmxaccountants.co.uk/:splat"
  status = 301
  force = true

# Netlify Forms — contact form submissions go to info@hmxaccountants.co.uk
# Configure email notification in: Netlify Dashboard → Forms → contact → Form notifications
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
